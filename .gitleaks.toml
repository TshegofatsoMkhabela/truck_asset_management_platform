# Gitleaks configuration for TAMP (#4). Rationale: docs/adr/0001-local-secret-scanning.md
#
# `useDefault` pulls in Gitleaks' full built-in ruleset. Rules are not re-declared
# here — this file exists only to hold project-specific exceptions on top of them.
#
# There are no exceptions yet, and deliberately no empty [allowlist] block: Gitleaks
# rejects an allowlist containing no checks and then refuses to run at all. To add the
# first one, uncomment and keep it narrow, with a comment saying why it is not a real
# secret. Prefer `regexes` (one known-fake literal) over `paths` — a path exemption
# also covers any real secret added to that directory later.
#
#   [allowlist]
#   description = "Project-specific exceptions."
#   regexes = ['''EXAMPLE_FAKE_KEY_VALUE''']
#   paths   = ['''^path/to/fixtures/.*''']

title = "TAMP secret scanning"

[extend]
useDefault = true
