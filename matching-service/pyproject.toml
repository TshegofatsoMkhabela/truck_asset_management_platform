[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matching-service"
version = "0.1.0"
description = "TAMP rule-based matching: given a load and candidate trucks, return eligible matches with reasons"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The 80% gate lives here rather than in the CI workflow so a local `pytest` run
# behaves identically to CI — you find out you dropped below the bar before you
# push, not after. `--cov-report=xml` feeds the artifact upload in CI.
addopts = [
    "--cov=matching_service",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=80",
]
